# Đặt lịch khuyến mãi
# Tại file này, bạn có thể lên kế hoạch cho các khuyến mãi trong tương lai
# Mỗi gạch đầu dòng là một kế hoạch khuyến mãi
#
# Các tùy chọn gồm có:
# * name: Tên khuyến mãi
# * rate: Tỉ lệ khuyến mãi, tính theo công thức sau:
#   * 0: Không có khuyến mãi
#   * 0.5: Khuyến mãi 50%, ví dụ: nạp 100k được 150k
#   * 1: Khuyến mãi 100%, ví dụ: nạp 100k được 200k
#   * 1.5: Khuyến mãi 150%, ví dụ: nạp 100k được 250k
#
# Thời gian khuyến mãi (bắt buộc, chọn 1 trong 2 kiểu):
# 1. Ngày cố định: bắt buộc có đủ from và to
#    * from: Thời điểm bắt đầu, định dạng dd/MM/yyyy HH:mm:ss hoặc dd/MM/yyyy HH:mm
#    * to: Thời điểm kết thúc, định dạng dd/MM/yyyy HH:mm:ss hoặc dd/MM/yyyy HH:mm
#      Khuyến mãi dừng đúng tại thời điểm to: 23:59 = dừng lúc 23:59:00, muốn trọn ngày thì dùng 23:59:59
# 2. Lặp lại hàng tuần: bắt buộc có ít nhất một trong days hoặc hours
#    * days: Các thứ trong tuần, 2 = thứ 2 ... 7 = thứ 7, 8 = chủ nhật. Chỉ có hours, không có days = mọi ngày
#    * hours: Khung giờ trong ngày, định dạng 'HH:mm-HH:mm' (đặt trong dấu nháy đơn), tối đa 24:00,
#      giờ kết thúc phải sau giờ bắt đầu. Chỉ có days, không có hours = cả ngày
#    * from/to (tùy chọn): chỉ lặp lại trong khoảng from -> to, có thể chỉ dùng from hoặc chỉ dùng to
#
# Mục không có thời gian (chỉ có name và rate), hoặc có dòng mà để trống giá trị, sẽ bị bỏ qua kèm cảnh báo
#
# Khuyến mãi ở file này sẽ được ưu tiên so với khuyến mãi được thiết lập ở file config.yml
#
# Trong trường hợp tại một thời điểm có nhiều khuyến mãi cùng lúc, khuyến mãi có tỉ lệ cao nhất sẽ được ưu tiên

# Tên hiển thị cho khuyến mãi đặt trong config.yml (extra-rate), vì loại này không có tên
legacy-name: '&aKhuyến mãi nạp thẻ'

