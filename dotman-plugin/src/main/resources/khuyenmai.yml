# Đặt lịch khuyến mãi
# Tại file này, bạn có thể lên kế hoạch cho các khuyến mãi trong tương lai
# Mỗi gạch đầu dòng là một kế hoạch khuyến mãi
#
# Các tùy chọn gồm có:
# * name: Tên khuyến mãi
# * rate: Tỉ lệ khuyến mãi, tính theo công thức sau:
#   * 0: Không có khuyến mãi
#   * 0.5: Khuyến mãi 50%, ví dụ: nạp 100k được 150k
#   * 1: Khuyến mãi 100%, ví dụ: nạp 100k được 200k
#   * 1.5: Khuyến mãi 150%, ví dụ: nạp 100k được 250k
#
# Thời gian khuyến mãi:
# 1. Ngày cố định:
#    * from: Thời điểm bắt đầu, định dạng dd/MM/yyyy HH:mm
#    * to: Thời điểm kết thúc, định dạng dd/MM/yyyy HH:mm
# 2. Lặp lại hàng tuần:
#    * days: Các thứ trong tuần, 2 = thứ 2 ... 7 = thứ 7, 8 = chủ nhật. Bỏ hẳn dòng days = mọi ngày
#    * hours: Khung giờ trong ngày, định dạng 'HH:mm-HH:mm' (đặt trong dấu nháy đơn). Bỏ hẳn dòng hours = cả ngày
#      Giờ kết thúc phải sau giờ bắt đầu, tối đa 24:00
#    (có dòng days/hours mà để trống giá trị sẽ bị báo lỗi)
# 3. Kết hợp: days/hours kèm from/to = chỉ lặp lại trong khoảng from -> to
#    (có thể bỏ hẳn dòng from hoặc to để không giới hạn; có dòng mà để trống giá trị sẽ bị báo lỗi)
#
# Khuyến mãi ở file này sẽ được ưu tiên so với khuyến mãi được thiết lập ở file config.yml
#
# Trong trường hợp tại một thời điểm có nhiều khuyến mãi cùng lúc, khuyến mãi có tỉ lệ cao nhất sẽ được ưu tiên

# Tên hiển thị cho khuyến mãi đặt trong config.yml (extra-rate), vì loại này không có tên
legacy-name: '&aKhuyến mãi nạp thẻ'

